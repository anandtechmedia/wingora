name: backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.db == 'mysql' && 'wingora_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      # MySQL 8 ships preinstalled on GitHub's Ubuntu runners (no containers used).
      - name: Start MySQL
        if: matrix.db == 'mysql'
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE wingora_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, pdo_sqlite, zip, gd, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Dependency audit
        run: composer audit

      - name: Tests
        run: php artisan test
