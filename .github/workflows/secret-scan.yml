name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum pinned)
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan commits
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"; else range="${{ github.event.before }}..${{ github.sha }}"; fi
          git cat-file -e "${range%%..*}" 2>/dev/null || range="${{ github.sha }}"
          ./gitleaks git --no-banner --redact --log-opts="$range" .
